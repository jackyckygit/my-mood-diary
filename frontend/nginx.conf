server {
  listen 80;

  # Serve the static files of the React app
  location / {
    root   /usr/share/nginx/html;
    index  index.html index.htm;
    try_files $uri $uri/ /index.html; # This is important for React Router
  }

  # Reverse proxy for API calls
  # Any request to /api/... will be forwarded to the backend service
  location /api {
    proxy_pass http://api:5000; # 'api' is the service name of our backend in docker-compose
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Optional: Error pages
  error_page   500 502 503 504  /50x.html;
  location = /50x.html {
    root   /usr/share/nginx/html;
  }
}